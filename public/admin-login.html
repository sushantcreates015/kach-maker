<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Access</title>
  <style>
    :root{--bg:#02140b;--card:#0b1f15e0;--line:rgba(255,255,255,.08);--text:#ecfdf5;--muted:#9fd7b8;--accent:#22c55e;--accent2:#15803d}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#072113,#03110a);display:grid;place-items:center;color:var(--text)}
    .card{width:min(92vw,430px);padding:34px;border-radius:28px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
    h1{margin:0 0 6px;font-size:32px}.muted{margin:0 0 24px;color:var(--muted)}
    label{display:block;font-size:13px;margin:0 0 8px}.field{margin-bottom:15px}.input{width:100%;padding:15px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;outline:none}.input:focus{border-color:rgba(34,197,94,.45);box-shadow:0 0 0 4px rgba(34,197,94,.12)}
    .btn{width:100%;padding:15px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;cursor:pointer;box-shadow:0 14px 32px rgba(34,197,94,.24)}
    .error{min-height:22px;margin-top:14px;color:#fecaca}
  </style>
</head>
<body>
  <form class="card" id="adminLoginForm">
    <h1>Admin sign in</h1>
    <p class="muted">Restricted control panel access.</p>
    <div class="field"><label for="username">Username</label><input class="input" id="username" autocomplete="username" required /></div>
    <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required /></div>
    <button class="btn" type="submit">Continue</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    const form = document.getElementById('adminLoginForm');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const res = await fetch('/api/admin/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        error.textContent = data.message || 'Unable to sign in.';
        return;
      }
      location.href = data.redirectTo;
    });
  </script>
</body>
</html>
