<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <style>
    :root{
      --bg:#03130b;--bg2:#071c12;--card:rgba(8,28,18,.82);--line:rgba(132, 204, 22, .15);--text:#ecfdf5;--muted:#a7f3d0;--soft:#d1fae5;--accent:#22c55e;--accent2:#16a34a;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#0f3d24 0%,#05160e 40%,#020b07 100%);color:var(--text);display:grid;place-items:center;overflow:hidden}
    body::before,body::after{content:"";position:fixed;border-radius:999px;filter:blur(90px);opacity:.35;pointer-events:none}
    body::before{width:340px;height:340px;left:-80px;top:-70px;background:#22c55e}
    body::after{width:320px;height:320px;right:-80px;bottom:-70px;background:#14532d}
    .card{width:min(92vw,420px);padding:34px;border-radius:30px;background:linear-gradient(180deg,rgba(6,22,14,.94),rgba(6,22,14,.78));border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px);box-shadow:0 32px 80px rgba(0,0,0,.45)}
    .brand{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#34d399,#16a34a);display:grid;place-items:center;font-size:26px;font-weight:800;box-shadow:0 15px 30px rgba(34,197,94,.3)}
    h1{margin:18px 0 6px;font-size:34px;letter-spacing:-.03em}
    p{margin:0 0 24px;color:var(--muted);font-size:14px}
    .field{margin-bottom:15px}
    .label{display:block;margin:0 0 8px;font-size:13px;color:var(--soft)}
    .input{width:100%;padding:15px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:15px;outline:none;transition:.22s ease}
    .input:focus{border-color:rgba(52,211,153,.55);box-shadow:0 0 0 4px rgba(34,197,94,.12);transform:translateY(-1px)}
    .btn{width:100%;margin-top:6px;padding:15px 18px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:15px;font-weight:700;cursor:pointer;transition:transform .22s ease, box-shadow .22s ease;box-shadow:0 14px 34px rgba(34,197,94,.24)}
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .error{min-height:22px;margin-top:14px;color:#fecaca;font-size:14px}
    .loading{opacity:.78;pointer-events:none}
  </style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand">S</div>
    <h1>Sign in</h1>
    <p>Enter your credentials to continue.</p>
    <div class="field">
      <label class="label" for="userId">User ID</label>
      <input class="input" id="userId" autocomplete="username" required />
    </div>
    <div class="field">
      <label class="label" for="password">Password</label>
      <input class="input" id="password" type="password" autocomplete="current-password" required />
    </div>
    <button class="btn" type="submit">Sign in</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      form.classList.add('loading');
      try {
        const res = await fetch('/api/auth/login', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            userId: document.getElementById('userId').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          error.textContent = data.message || 'Unable to sign in.';
          return;
        }
        location.href = data.redirectTo || '/index.html';
      } finally {
        form.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
