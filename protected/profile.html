      @font-face {
        font-family: "CashMarket";
        font-style: normal;
        src: url('/font/CashSans.ttf');
        font-display: swap;
      }
      :root {
        --padding-screen: 20px;
        --app-bg-color: #ffffff;
        --text-primary: #000000;
        --text-secondary: #6c757d;
        --accent-green: #00d54b;
        --border-color-light: #e9ecef;
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --font-family: "CashMarket", -apple-system, BlinkMacSystemFont,
          sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--font-family);
        background-color: var(--app-bg-color);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      body.modal-open {
        overflow: hidden;
      }
      a {
        text-decoration: none;
        color: inherit;
      }

      .profile-app-container {
        max-width: 450px;
        width: 100%;
        height: 100%;
        margin: 0 auto;
        background-color: var(--app-bg-color);
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .profile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--padding-screen);
        flex-shrink: 0;
      }
      .header-icon {
        font-size: 24px;
        color: var(--text-primary);
      }

      /* --- **FIXED** Scrollable Content Area --- */
      .profile-main-content {
        padding: 0 var(--padding-screen);
        text-align: center;
        flex-grow: 1; /* Allows this area to take up remaining space */
        overflow-y: auto; /* Enables vertical scrolling if content overflows */
        padding-bottom: 40px; /* Adds space at the bottom of the scroll */
      }
      .profile-main-content::-webkit-scrollbar {
        display: none;
      } /* Hide scrollbar for aesthetics */
      .profile-main-content {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .profile-pic-wrapper {
        margin: 20px auto 16px;
        width: 100px;
        height: 100px;
        padding: 5px;
        border-radius: 50%;
        border: 2px dashed var(--accent-green);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .profile-pic {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        background-color: var(--border-color-light);
      }
      .profile-name {
        font-size: 24px;
        font-weight: 600;
      }
      .profile-cashtag {
        font-size: 18px;
        color: var(--text-secondary);
        margin-top: 4px;
        margin-bottom: 24px;
      }
      .invite-btn {
        width: 100%;
        padding: 16px;
        background-color: var(--accent-green);
        color: white;
        border: none;
        border-radius: 28px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 30px;
      }

      .settings-list {
        list-style: none;
        text-align: left;
      }
      .settings-item {
        border-bottom: 1px solid var(--border-color-light);
      }
      .settings-item:last-child {
        border-bottom: none;
      }

      .settings-item a {
        display: flex;
        align-items: center;
        padding: 18px 0;
      }
      .settings-icon {
        font-size: 18px;
        width: 30px;
        text-align: center;
        margin-right: 16px;
        color: var(--text-primary);
      }
      .settings-label {
        font-size: 16px;
        font-weight: 500;
        flex-grow: 1;
      }
      .notification-dot {
        width: 8px;
        height: 8px;
        background-color: red;
        border-radius: 50%;
        margin-right: 12px;
      }

      .settings-chevron-svg {
        width: 9px;
        height: 15px;
      }

      /* Personal Edit Overlay */
      .personal-edit-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        z-index: 4000;
        transform: translateX(100%);
        transition: transform 0.35s ease-in-out;
      }
      .personal-edit-overlay.show {
        transform: translateX(0);
      }
      .edit-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--padding-screen);
        border-bottom: 1px solid var(--border-color-light);
      }
      .edit-back-btn {
        font-size: 20px;
        background: none;
        border: none;
        cursor: pointer;
      }
      .edit-title {
        font-size: 18px;
        font-weight: 600;
      }
      .edit-done-btn {
        font-size: 17px;
        font-weight: 600;
        color: var(--accent-green);
        background: none;
        border: none;
        cursor: pointer;
      }
      .edit-done-btn:disabled {
        color: #a0e6bb;
      }
      .edit-content {
        padding: 24px var(--padding-screen);
      }
      .edit-profile-pic {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        background-color: var(--border-color-light);
        display: block;
        margin: 0 auto 24px;
        cursor: pointer;
      }
      #edit-pic-input {
        display: none;
      }
      .input-group {
        margin-bottom: 20px;
      }
      .input-group label {
        display: block;
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color-light);
        border-radius: 8px;
        font-size: 16px;
        font-family: inherit;
      }
    </style>

    <script>
      const userProfileKey = "cashAppUserProfile";
      const localStorageBalanceKey = "cashAppBalance";
      const defaultProfile = {
        fullName: "Jane Doe",
        cashtag: "waldoapp",
        accountNumber: "****3186",
        routingNumber: "****715",
        profilePic: "",
      };
      let userProfile = {};

      // DOM Elements
      const mainProfilePic = document.getElementById("main-profile-pic");
      const mainProfileName = document.getElementById("main-profile-name");
      const mainCashtag = document.getElementById("main-cashtag");
      const personalBtn = document.getElementById("personal-btn");
      const personalEditOverlay = document.getElementById(
        "personal-edit-overlay"
      );
      const editBackBtn = document.getElementById("edit-back-btn");
      const editDoneBtn = document.getElementById("edit-done-btn");
      const editProfilePic = document.getElementById("edit-profile-pic");
      const editPicInput = document.getElementById("edit-pic-input");
      const editFullName = document.getElementById("edit-full-name");
      const editCashtag = document.getElementById("edit-cashtag");
      const editAccountNumber = document.getElementById("edit-account-number");
      const editRoutingNumber = document.getElementById("edit-routing-number");
      const editPersonalBalance = document.getElementById("edit-personal-balance");

      function saveProfile() {
        localStorage.setItem(userProfileKey, JSON.stringify(userProfile));
      }

      function loadProfile() {
        const savedProfile = localStorage.getItem(userProfileKey);
        userProfile = savedProfile
          ? JSON.parse(savedProfile)
          : { ...defaultProfile };
        userProfile = { ...defaultProfile, ...userProfile };
        updateMainUI();
      }

      function updateMainUI() {
        mainProfileName.textContent = userProfile.fullName;
        mainCashtag.textContent = `$${userProfile.cashtag}`;
        if (userProfile.profilePic) {
          mainProfilePic.src = userProfile.profilePic;
        } else {
          mainProfilePic.src = "images/pi2_camera_button_disabled.png"; // Transparent pixel
        }
      }

      function openEditOverlay() {
        editFullName.value = userProfile.fullName;
        editCashtag.value = userProfile.cashtag;
        editAccountNumber.value = userProfile.accountNumber;
        editRoutingNumber.value = userProfile.routingNumber;
        const savedBalance = localStorage.getItem(localStorageBalanceKey);
        editPersonalBalance.value = savedBalance !== null ? savedBalance : "";
        editProfilePic.src =
          userProfile.profilePic || "images/pi2_camera_button_disabled.png";

        editDoneBtn.disabled = true;
        personalEditOverlay.classList.add("show");
        document.body.classList.add("modal-open");
      }

      function closeEditOverlay() {
        personalEditOverlay.classList.remove("show");
        document.body.classList.remove("modal-open");
      }

      function handleSaveChanges() {
        userProfile.fullName = editFullName.value;
        userProfile.cashtag = editCashtag.value;
        userProfile.accountNumber = editAccountNumber.value;
        userProfile.routingNumber = editRoutingNumber.value;

        // Save personal balance so it shows on Home (index.html) and the footer
        const rawBalance = (editPersonalBalance.value || "").toString().replace(/[^0-9.\-]/g, "");
        const parsedBalance = parseFloat(rawBalance);
        if (!isNaN(parsedBalance)) {
          localStorage.setItem(localStorageBalanceKey, parsedBalance.toString());
          window.dispatchEvent(new CustomEvent("balanceUpdated"));
        }

        saveProfile();
        updateMainUI();
        closeEditOverlay();
      }

      // Event Listeners
      personalBtn.addEventListener("click", (e) => {
        e.preventDefault();
        openEditOverlay();
      });
      editBackBtn.addEventListener("click", closeEditOverlay);
      editDoneBtn.addEventListener("click", handleSaveChanges);

      [editFullName, editCashtag, editAccountNumber, editRoutingNumber, editPersonalBalance].forEach(
        (input) => {
          input.addEventListener("input", () => {
            editDoneBtn.disabled = false;
          });
        }
      );

      editProfilePic.addEventListener("click", () => {
        editPicInput.click();
      });
      editPicInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const newPicSrc = e.target.result;
          editProfilePic.src = newPicSrc;
          userProfile.profilePic = newPicSrc;
          editDoneBtn.disabled = false;
        };
        reader.readAsDataURL(file);
      });

      document.addEventListener("DOMContentLoaded", loadProfile);
    </script>

  /* Theme row UI (injected via JS) */

</style>

<script>
  (function () {
    const THEME_KEY = "cashAppThemeMode";

    // Your current defaults from :root (we read + store them so "Green" restores perfectly)
    const root = document.documentElement;
    const body = document.body;

    const VARS = [
      "--app-bg-color",
      "--text-primary",
      "--text-secondary",
      "--border-color-light",
      "--accent-green",
    ];

    function getCurrentVars() {
      const cs = getComputedStyle(root);
      const out = {};
      VARS.forEach((v) => (out[v] = cs.getPropertyValue(v).trim()));
      return out;
    }

    const DEFAULTS = getCurrentVars();

    function setVars(map) {
      Object.keys(map).forEach((k) => root.style.setProperty(k, map[k]));
    }

    function applyTheme(mode) {
      // used for CSS overrides
      body.setAttribute("data-theme", mode);

      if (mode === "dark") {
        // "all root green to black" + dark UI
        setVars({
          "--app-bg-color": "#000000",
          "--text-primary": "#ffffff",
          "--text-secondary": "rgba(255,255,255,0.65)",
          "--border-color-light": "rgba(255,255,255,0.15)",
          "--accent-green": "#000000",
        });
      } else if (mode === "white") {
        // "make white" (including accent) + safety overrides in CSS above
        setVars({
          "--app-bg-color": "#ffffff",
          "--text-primary": "#000000",
          "--text-secondary": "#6c757d",
          "--border-color-light": "#e9ecef",
          "--accent-green": "#ffffff",
        });
      } else {
        // Green/default: restore EXACT originals
        setVars(DEFAULTS);
        body.setAttribute("data-theme", "green");
      }

      localStorage.setItem(THEME_KEY, mode);
      updateActiveButtons(mode);
    }

    function updateActiveButtons(mode) {
      const btns = document.querySelectorAll("[data-theme-pick]");
      btns.forEach((b) => b.classList.toggle("active", b.dataset.themePick === mode));
    }

    function injectThemeRow() {
      const list = document.querySelector(".settings-list");
      if (!list) return;

      // avoid double-inject
      if (document.getElementById("theme-settings-item")) return;

      const li = document.createElement("li");
      li.className = "settings-item";
      li.id = "theme-settings-item";

      li.innerHTML = `
        <div class="theme-row">
          <i class="settings-icon fa-solid fa-palette"></i>
          <span class="settings-label">Theme</span>
          <div class="theme-controls">
            <button class="theme-btn" type="button" data-theme-pick="dark">Dark</button>
            <button class="theme-btn" type="button" data-theme-pick="white">White</button>
            <button class="theme-btn" type="button" data-theme-pick="green">Green</button>
          </div>
        </div>
      `;

      list.appendChild(li);

      li.querySelectorAll("[data-theme-pick]").forEach((btn) => {
        btn.addEventListener("click", () => applyTheme(btn.dataset.themePick));
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      injectThemeRow();

      // Apply saved theme (default to green/current)
      const saved = localStorage.getItem(THEME_KEY) || "green";
      applyTheme(saved);
    });
  })();
</script>

 <script>
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("copy", (e) => e.preventDefault());
  document.addEventListener("cut", (e) => e.preventDefault());
  document.addEventListener("paste", (e) => e.preventDefault());

  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();

    if (
      e.key === "F12" ||
      (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(k)) ||
      (e.ctrlKey && ["u", "s", "c", "x", "v", "a"].includes(k)) ||
      (e.metaKey && ["u", "s", "c", "x", "v", "a"].includes(k))
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>
